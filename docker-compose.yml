# Runs The Persistent Operator alongside Redis Stack (bundles the
# RedisJSON + RediSearch modules the checkpointer/store require — see
# app/config.py's redis_url docstring).
#
# Usage:
#   1. Set REDIS_URL=redis://redis:6379 in .env (note: "redis", not
#      "localhost" — service-to-service DNS inside compose)
#   2. docker compose up --build

services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI, optional but useful for inspecting stored memory
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  redis_data:
